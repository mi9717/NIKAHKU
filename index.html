    <script>
      (function() {
        // Ensure window.fetch has both a getter and a setter so extension scripts/executors can wrap it safely
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {}

        // Suppress unhandled errors originating from browser extensions
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
